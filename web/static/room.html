<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeks</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M32 8C17 8 6 17.5 6 29c0 6.5 3.5 12.3 9 16l-3 11 12.5-7c2.4.6 4.9 1 7.5 1 15 0 26-9.5 26-21S47 8 32 8z%27 fill=%27%230E9594%27/%3E%3Ccircle cx=%2750%27 cy=%2712%27 r=%277%27 fill=%27%23FF8FAB%27/%3E%3C/svg%3E">
  <meta name="theme-color" content="#0E9594">
  <script type="module" src="/static/room.js"></script>
</head>
<body class="room">
  <header class="topbar">
    <a href="/" class="logo small">Meeks</a>
    <div class="room-info">
      <span id="room-title"></span>
      <span id="status" class="badge">接続中…</span>
    </div>
    <div class="actions">
      <button id="copy-url" title="招待URLをコピー">URLをコピー</button>
      <button id="call" class="primary">ビデオ通話</button>
    </div>
  </header>

  <div id="warn" class="warn" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <h3>参加者</h3>
      <ul id="members"></ul>
      <h3>安全確認コード</h3>
      <p class="hint">全員の表示が同じなら同じ鍵で暗号化されています。</p>
      <p id="fingerprint" class="fingerprint"></p>
      <h3>過去ログ</h3>
      <p class="hint">参加者同士で自動的に同期されます。</p>
      <button id="clear-history" class="danger">この端末のログを削除</button>
      <footer class="sidebar-footer"><small>(C) PAPS</small></footer>
    </aside>

    <main class="chat">
      <section id="videos" class="videos" hidden>
        <div class="video-tools">
          <button id="toggle-mic">マイク: オン</button>
          <button id="toggle-cam">カメラ: オン</button>
          <button id="hangup" class="danger">通話終了</button>
        </div>
        <div id="video-grid" class="video-grid"></div>
      </section>

      <section id="requests" class="requests" hidden></section>

      <section id="join-banner" class="join-banner" hidden>
        <p id="join-text"></p>
        <p id="join-code-line" class="hint">あなたの確認コード <b id="join-code"></b>（承認する人の画面にも同じコードが表示されます）</p>
      </section>

      <ol id="messages" class="messages"></ol>

      <form id="composer" class="composer">
        <label id="file-btn" class="file-btn" title="ファイルを送信">
          📎<input type="file" id="file" multiple hidden>
        </label>
        <textarea id="text" rows="1" maxlength="10000" placeholder="メッセージ（Enterで送信 / Shift+Enterで改行）"></textarea>
        <button id="send" class="primary">送信</button>
      </form>
    </main>
  </div>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2>表示名</h2>
      <input id="name-input" maxlength="32" required autocomplete="nickname">
      <button class="primary">入室</button>
    </form>
  </dialog>
</body>
</html>
