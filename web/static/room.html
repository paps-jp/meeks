<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeks</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M32 8C17 8 6 17.5 6 29c0 6.5 3.5 12.3 9 16l-3 11 12.5-7c2.4.6 4.9 1 7.5 1 15 0 26-9.5 26-21S47 8 32 8z%27 fill=%27%230E9594%27/%3E%3Ccircle cx=%2750%27 cy=%2712%27 r=%277%27 fill=%27%23FF8FAB%27/%3E%3C/svg%3E">
  <meta name="theme-color" content="#0E9594">
  <script type="module" src="/static/room.js"></script>
</head>
<body class="room">
  <header class="topbar">
    <a href="/" class="logo small">Meeks</a>
    <div class="room-info">
      <span id="room-title"></span>
      <span id="status" class="badge" data-i18n="room.status.connecting"></span>
    </div>
    <div class="actions">
      <button id="copy-url" data-i18n="room.copyUrl" data-i18n-title="room.copyUrlTitle"></button>
      <button id="leave" class="danger" data-i18n="room.leave"></button>
      <div id="call-wrap" class="call-wrap">
        <button id="call" class="primary" aria-haspopup="menu" aria-expanded="false" aria-controls="call-menu" data-i18n="room.call"></button>
        <div id="call-menu" class="call-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-kind="audio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
            <span data-i18n="room.callVoice"></span>
          </button>
          <button type="button" role="menuitem" data-kind="video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l5.5-3v9l-5.5-3"/></svg>
            <span data-i18n="room.callVideo"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="warn" class="warn" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <h3 data-i18n="room.members"></h3>
      <ul id="members"></ul>
      <h3 data-i18n="room.safetyCode"></h3>
      <p class="hint" data-i18n="room.safetyHint"></p>
      <p id="fingerprint" class="fingerprint"></p>
      <h3 data-i18n="room.history"></h3>
      <p class="hint" data-i18n="room.historyHint"></p>
      <button id="clear-history" class="danger" data-i18n="room.clearHistory"></button>
      <h3><label for="lang-select" data-i18n="room.language"></label></h3>
      <select id="lang-select"></select>
      <footer class="sidebar-footer"><small>(C) PAPS</small></footer>
    </aside>

    <main class="chat">
      <section id="videos" class="videos" hidden>
        <div class="video-tools">
          <button id="toggle-mic"></button>
          <button id="toggle-cam"></button>
          <button id="hangup" class="danger" data-i18n="room.hangup"></button>
        </div>
        <div id="video-grid" class="video-grid"></div>
      </section>

      <section id="requests" class="requests" hidden></section>

      <section id="join-banner" class="join-banner" hidden>
        <p id="join-text"></p>
        <p id="join-code-line" class="hint"><span data-i18n="room.joinCodeLabel"></span> <b id="join-code" dir="ltr"></b> <span data-i18n="room.joinCodeNote"></span></p>
      </section>

      <ol id="messages" class="messages"></ol>

      <form id="composer" class="composer">
        <label id="file-btn" class="file-btn" data-i18n-title="room.sendFile">
          📎<input type="file" id="file" multiple hidden>
        </label>
        <textarea id="text" rows="1" maxlength="10000"></textarea>
        <button id="send" class="primary" data-i18n="room.send"></button>
      </form>
    </main>
  </div>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2 data-i18n="room.nameTitle"></h2>
      <input id="name-input" maxlength="32" required autocomplete="nickname">
      <button class="primary" data-i18n="room.enter"></button>
    </form>
  </dialog>
</body>
</html>
