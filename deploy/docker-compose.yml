name: meeks

# Meeks next to an existing Caddy that terminates TLS (e.g. the passist
# stack).
#
# The container uses the host network: the TURN relay needs a large UDP
# port range, and publishing ranges through Docker starts one docker-proxy
# process per port and IP family (1000 ports = ~2000 processes), which does
# not fit a small VPS. With the host network, UFW also applies directly.
#
# HTTP listens on HTTP_ADDR. Set it to the gateway IP of Caddy's Docker
# network (e.g. 172.18.0.1:8080) so that only Caddy can reach it, allow that
# network in UFW, and point Caddy at it (see Caddyfile.meeks).
#
# Setup:
#   cp .env.example .env         # fill in PUBLIC_IP, TURN_SECRET, HTTP_ADDR
#   mkdir -p data && sudo chown 65532:65532 data && sudo chmod 700 data
#   docker compose up -d --build
#
# Ports to open in every firewall in front of the server:
#   3479/tcp, 3479/udp (TURN), TURN_RELAY_MIN-TURN_RELAY_MAX/udp (relays).
# The defaults 30000-30999 avoid coturn (3478, 49152-65535), stay below the
# kernel's ephemeral range (32768+) and fit packet filters limited to ports
# 1-32767 (e.g. Sakura VPS). TURN is reached by IP, not through Cloudflare
# (which cannot proxy UDP).
services:
  meeks:
    build:
      context: ..
    image: meeks:latest
    container_name: meeks
    restart: unless-stopped
    network_mode: host
    command:
      - -addr=${HTTP_ADDR:-127.0.0.1:8080}
      - -site-url=${SITE_URL:-https://meeks.paps.jp}
      - -trust-proxy
      - -iplog-dir=/data/iplog
      - -iplog-days=${IPLOG_DAYS:-730}
      - -state-file=/data/state.json
      - -turn-addr=:3479
      - -turn-public-ip=${PUBLIC_IP}
      - -turn-host=${TURN_HOST:-${PUBLIC_IP}}
      - -turn-relay-min=${TURN_RELAY_MIN:-30000}
      - -turn-relay-max=${TURN_RELAY_MAX:-30999}
      - -turn-max-allocs=${TURN_MAX_ALLOCS:-1000}
      - -turn-max-allocs-per-user=${TURN_MAX_ALLOCS_PER_USER:-30}
      - -cf-turn-monthly-gb=${CF_TURN_MONTHLY_GB:-900}
    # Secrets go through the environment, not the command line (visible in ps).
    environment:
      TURN_SECRET: ${TURN_SECRET}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_KEY_TOKEN: ${CF_TURN_KEY_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
    volumes:
      - ./data:/data
